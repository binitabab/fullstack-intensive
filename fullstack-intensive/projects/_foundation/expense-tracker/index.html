<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expense Tracker — P1</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>Expense Tracker</h1>
        <p class="lede">
          Local prototype — your data stays in this browser
          (<code>localStorage</code>). Not a bank app.
        </p>
      </header>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title" class="visually-hidden" style="position:absolute;left:-9999px">
          Add or edit expense
        </h2>
        <form id="expense-form" class="row form" novalidate>
          <input type="hidden" id="editing-id" value="" />
          <label>
            Description
            <input id="description" name="description" autocomplete="off" required />
          </label>
          <label>
            Amount
            <input
              id="amount"
              name="amount"
              type="number"
              min="0.01"
              step="0.01"
              required
            />
          </label>
          <label>
            Category
            <input id="category" name="category" list="category-suggestions" required />
          </label>
          <datalist id="category-suggestions">
            <option value="food"></option>
            <option value="transport"></option>
            <option value="rent"></option>
            <option value="utilities"></option>
            <option value="other"></option>
          </datalist>
          <div class="actions">
            <button type="submit" id="submit-btn">Add expense</button>
            <button type="button" id="cancel-edit" class="secondary" hidden>
              Cancel
            </button>
          </div>
        </form>
        <p id="message" class="msg" role="status" aria-live="polite"></p>
      </section>

      <section class="card">
        <div class="row toolbar">
          <label>
            Filter by category
            <input id="filter-category" placeholder="e.g. food" />
          </label>
          <label>
            Sort
            <select id="sort-by">
              <option value="createdAt:desc">Newest first</option>
              <option value="createdAt:asc">Oldest first</option>
              <option value="amount:desc">Amount high → low</option>
              <option value="amount:asc">Amount low → high</option>
            </select>
          </label>
          <p class="total">Total: $<span id="total">0.00</span></p>
        </div>

        <p id="empty-state" class="empty">No expenses yet. Add your first one above.</p>
        <ul id="expense-list" class="list" aria-live="polite"></ul>
      </section>
    </main>

    <!-- type="module" enables import/export across our src/ files -->
    <script type="module" src="./src/ui/app.js"></script>
  </body>
</html>
