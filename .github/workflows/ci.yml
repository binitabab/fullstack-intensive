name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bizflow:
    name: BizFlow build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack-intensive/projects/bizflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fullstack-intensive/projects/bizflow/package-lock.json
      - run: npm ci
      - run: npm run build

  foundation-expense-tracker:
    name: Foundation expense-tracker check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack-intensive/projects/_foundation/expense-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
